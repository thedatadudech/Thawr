name: Feature request
description: Propose something Thawr should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features follow written specs (`docs/specs/`). Please check `docs/VISION.md`
        (especially "What Thawr deliberately is not") and `TASKS.md` before filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and in which setup?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work from the user's point of view (commands, config, policy)?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Fit
      description: Which principle in `docs/VISION.md` does this serve, and does it need a second service or a new dependency?
